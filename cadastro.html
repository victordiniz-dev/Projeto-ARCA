<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastre-se no Programa ARCA. Faça parte do sistema de adoção e controle de castrações na Serra/ES.">
  <title>Cadastro de Tutor - Programa ARCA</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    body {
      background: linear-gradient(135deg, var(--color-primary-50) 0%, #FFFFFF 50%, var(--color-secondary-light) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
      position: relative;
    }

    .auth-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      width: 100%;
      max-width: 680px;
      padding: var(--space-2xl);
      border: 1px solid var(--color-border-light);
      position: relative;
      z-index: 1;
      animation: scaleIn 0.4s ease;
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
      text-decoration: none;
    }

    .auth-logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }

    .auth-logo-icon svg {
      width: 24px;
      height: 24px;
    }

    .auth-logo-text {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-extrabold);
      color: var(--color-text);
    }

    .auth-logo-text span {
      color: var(--color-primary);
    }

    /* Stepper Styling */
    .stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-2xl);
      position: relative;
    }

    .stepper__step {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .stepper__circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-bg-light);
      border: 2px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--font-weight-bold);
      color: var(--color-text-light);
      transition: all var(--transition-base);
    }

    .stepper__circle.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
      box-shadow: 0 4px 10px rgba(0, 208, 132, 0.3);
    }

    .stepper__circle.completed {
      background: var(--color-primary-50);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .stepper__label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-light);
    }

    .stepper__step.active .stepper__label {
      color: var(--color-text);
    }

    .stepper__line {
      flex: 1;
      height: 2px;
      background: var(--color-border);
      margin: 0 var(--space-md);
      min-width: 40px;
      max-width: 80px;
      transition: background var(--transition-base);
    }

    .stepper__line.active {
      background: var(--color-primary);
    }

    .form-step {
      display: none;
    }

    .form-step.active {
      display: block;
      animation: fadeIn var(--transition-base) ease forwards;
    }

    .step-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-xl);
      border-top: 1px solid var(--color-border-light);
      padding-top: var(--space-lg);
    }

    .form-row {
      display: flex;
      gap: var(--space-md);
    }

    .form-row .form-group {
      flex: 1;
    }

    .w-30 {
      flex: 0 0 30% !important;
    }

    .w-70 {
      flex: 0 0 70% !important;
    }

    .back-to-login {
      text-align: center;
      font-size: var(--font-size-sm);
      color: var(--color-text-light);
      margin-top: var(--space-xl);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <div class="auth-logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 10c-1.5 2-3 3.5-3 5.5a3 3 0 1 0 6 0c0-2-1.5-3.5-3-5.5z"/>
              <circle cx="7" cy="6" r="2"/>
              <circle cx="17" cy="6" r="2"/>
              <circle cx="4.5" cy="11" r="1.5"/>
              <circle cx="19.5" cy="11" r="1.5"/>
            </svg>
          </div>
          <span class="auth-logo-text">Programa <span>ARCA</span></span>
        </a>
        <h1 class="auth-title" style="font-size: 1.5rem; margin-top: var(--space-xs);">Cadastro de Tutor</h1>
        <p class="auth-subtitle">Crie sua conta para solicitar castração e adotar animais.</p>
      </div>

      <!-- Stepper Progress -->
      <div class="stepper" id="cadastroStepper">
        <div class="stepper__step active">
          <div class="stepper__circle active">1</div>
          <span class="stepper__label">Dados Pessoais</span>
        </div>
        <div class="stepper__line"></div>
        <div class="stepper__step">
          <div class="stepper__circle">2</div>
          <span class="stepper__label">Endereço</span>
        </div>
        <div class="stepper__line"></div>
        <div class="stepper__step">
          <div class="stepper__circle">3</div>
          <span class="stepper__label">Acesso</span>
        </div>
      </div>

      <form id="cadastroForm" novalidate>
        <!-- ETAPA 1: DADOS PESSOAIS -->
        <div class="form-step active" id="step1">
          <div class="form-group">
            <label for="nome" class="form-label">Nome Completo <span class="required">*</span></label>
            <input type="text" id="nome" class="form-input" placeholder="Seu nome completo" required>
            <div class="form-error"></div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="cpf" class="form-label">CPF <span class="required">*</span></label>
              <input type="text" id="cpf" data-validate="cpf" class="form-input" placeholder="000.000.000-00" required>
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label for="nascimento" class="form-label">Data de Nascimento <span class="required">*</span></label>
              <input type="date" id="nascimento" class="form-input" required>
              <div class="form-error"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="telefone" class="form-label">Telefone Celular <span class="required">*</span></label>
              <input type="text" id="telefone" data-validate="phone" class="form-input" placeholder="(27) 99999-9999" required>
              <div class="form-error"></div>
            </div>
            <div class="form-group">
              <label for="email" class="form-label">E-mail <span class="required">*</span></label>
              <input type="email" id="email" data-validate="email" class="form-input" placeholder="seuemail@exemplo.com" required>
              <div class="form-error"></div>
            </div>
          </div>

          <div class="step-actions">
            <div></div>
            <button type="button" class="btn btn-primary" data-action="next">
              Avançar
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- ETAPA 2: ENDEREÇO -->
        <div class="form-step" id="step2">
          <div class="form-row">
            <div class="form-group w-30">
              <label for="cep" class="form-label">CEP <span class="required">*</span></label>
              <input type="text" id="cep" data-validate="cep" class="form-input" placeholder="00000-000" required>
              <div class="form-error"></div>
            </div>
            <div class="form-group w-70">
              <label for="rua" class="form-label">Rua / Logradouro <span class="required">*</span></label>
              <input type="text" id="rua" class="form-input" placeholder="Nome da rua" required>
              <div class="form-error"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group w-30">
              <label for="numero" class="form-label">Número <span class="required">*</span></label>
              <input type="text" id="numero" class="form-input" placeholder="Nº" required>
              <div class="form-error"></div>
            </div>
            <div class="form-group w-70">
              <label for="complemento" class="form-label">Complemento</label>
              <input type="text" id="complemento" class="form-input" placeholder="Apto, Bloco, etc.">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="bairro" class="form-label">Bairro <span class="required">*</span></label>
              <input type="text" id="bairro" class="form-input" placeholder="Seu bairro" required>
              <div class="form-error"></div>
            </div>
            <div class="form-group w-70">
              <label for="cidade" class="form-label">Cidade <span class="required">*</span></label>
              <input type="text" id="cidade" class="form-input" value="Serra" required>
              <div class="form-error"></div>
            </div>
            <div class="form-group w-30">
              <label for="estado" class="form-label">Estado <span class="required">*</span></label>
              <input type="text" id="estado" class="form-input" value="ES" maxlength="2" required>
              <div class="form-error"></div>
            </div>
          </div>

          <div class="step-actions">
            <button type="button" class="btn btn-outline" data-action="prev">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              Voltar
            </button>
            <button type="button" class="btn btn-primary" data-action="next">
              Avançar
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- ETAPA 3: DADOS DE ACESSO -->
        <div class="form-step" id="step3">
          <div class="form-group">
            <label for="password" class="form-label">Senha <span class="required">*</span></label>
            <div class="form-input-wrapper">
              <input type="password" id="password" class="form-input" data-strength-indicator placeholder="Crie uma senha forte" required>
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <button
                type="button"
                class="input-action"
                data-toggle-password
                aria-label="Mostrar senha"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
              <div class="form-error"></div>
            </div>
            
            <!-- Password Strength Bar -->
            <div class="password-strength" data-strength="0">
              <div class="password-strength__bar"></div>
              <div class="password-strength__bar"></div>
              <div class="password-strength__bar"></div>
              <div class="password-strength__bar"></div>
            </div>
            <div class="password-strength__text text-muted">Senha vazia</div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirmar Senha <span class="required">*</span></label>
            <div class="form-input-wrapper">
              <input type="password" id="confirmPassword" class="form-input" placeholder="Repita a senha criada" required>
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <button
                type="button"
                class="input-action"
                data-toggle-password
                aria-label="Mostrar senha"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
              <div class="form-error"></div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-check">
              <input type="checkbox" id="terms" required>
              <span>Eu concordo com os <a href="#" class="link">Termos de Serviço</a> e <a href="#" class="link">Políticas de Proteção de Dados (LGPD)</a> do Programa ARCA.</span>
            </label>
            <div class="form-error"></div>
          </div>

          <div class="step-actions">
            <button type="button" class="btn btn-outline" data-action="prev">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              Voltar
            </button>
            <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
              Finalizar Cadastro
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </form>

      <div class="back-to-login">
        Já possui conta? <a href="login.html" class="link">Acesse aqui</a>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/main.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cadastroForm = document.getElementById('cadastroForm');
      
      if (cadastroForm) {
        // Setup Form validaton and mask bindings
        Validation.setupFormValidation(cadastroForm);
        
        // Setup Multi step stepper
        Forms.setupMultiStepForm('cadastroForm', 'cadastroStepper');

        // Setup ViaCEP
        Forms.setupViaCEP('cep', {
          street: 'rua',
          neighborhood: 'bairro',
          city: 'cidade',
          state: 'estado'
        });

        // Submit form handler
        cadastroForm.addEventListener('submit', (e) => {
          e.preventDefault();

          const password = document.getElementById('password');
          const confirmPassword = document.getElementById('confirmPassword');
          const terms = document.getElementById('terms');

          let isValid = Validation.validateForm(cadastroForm);

          // Custom check for step 3
          if (password.value !== confirmPassword.value) {
            Validation.setFieldState(confirmPassword, false, 'As senhas não coincidem');
            isValid = false;
          } else {
            Validation.setFieldState(confirmPassword, true);
          }

          if (!terms.checked) {
            Validation.setFieldState(terms, false, 'Você precisa aceitar os termos');
            isValid = false;
          } else {
            Validation.setFieldState(terms, true);
          }

          if (isValid) {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add('loading');

            setTimeout(() => {
              submitBtn.classList.remove('loading');
              
              // Save mock user to LocalStorage
              const mockUser = {
                name: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                cpf: document.getElementById('cpf').value,
                phone: document.getElementById('telefone').value,
                address: {
                  cep: document.getElementById('cep').value,
                  street: document.getElementById('rua').value,
                  number: document.getElementById('numero').value,
                  bairro: document.getElementById('bairro').value
                }
              };
              Utils.Storage.set('arca_user', mockUser);
              Utils.Storage.remove('cadastroForm_draft'); // Clean draft

              if (window.showToast) window.showToast('Cadastro realizado com sucesso!', 'success');

              setTimeout(() => {
                window.location.href = 'dashboard.html';
              }, 1000);
            }, 2000);

          } else {
            if (window.showToast) window.showToast('Por favor, verifique os campos antes de finalizar.', 'error');
          }
        });
      }
    });
  </script>
</body>
</html>
