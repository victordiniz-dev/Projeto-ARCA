<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gerencie seus pets no Programa ARCA. Edite, cadastre novos e veja o histórico.">
  <title>Meus Pets - Programa ARCA</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-primary-light);
      color: var(--color-primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-base);
    }

    .pets-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-lg);
    }

    @media (max-width: 1024px) {
      .pets-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .pets-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__close" id="sidebarCloseBtn" aria-label="Fechar menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </div>

      <div class="sidebar__header">
        <a href="index.html" class="sidebar__logo">
          <div class="sidebar__logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 10c-1.5 2-3 3.5-3 5.5a3 3 0 1 0 6 0c0-2-1.5-3.5-3-5.5z"/>
              <circle cx="7" cy="6" r="2"/><circle cx="17" cy="6" r="2"/>
            </svg>
          </div>
          <span class="sidebar__logo-text">Programa <span>ARCA</span></span>
        </a>
      </div>

      <nav class="sidebar__nav">
        <div class="sidebar__nav-section">
          <div class="sidebar__nav-label">Navegação</div>
          <a href="dashboard.html" class="sidebar__link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Visão Geral
          </a>
          <a href="meus-pets.html" class="sidebar__link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 10c-1.5 2-3 3.5-3 5.5a3 3 0 1 0 6 0c0-2-1.5-3.5-3-5.5z"/><circle cx="7" cy="6" r="2"/><circle cx="17" cy="6" r="2"/></svg>
            Meus Pets
          </a>
          <a href="agendamento.html" class="sidebar__link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Agendar Serviço
          </a>
          <a href="relatorios.html" class="sidebar__link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            Relatórios / Histórico
          </a>
        </div>

        <div class="sidebar__nav-section">
          <div class="sidebar__nav-label">Serviços Externos</div>
          <a href="resgate.html" class="sidebar__link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            Solicitar Resgate
          </a>
          <a href="denuncia.html" class="sidebar__link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Denúncia Anônima
          </a>
        </div>
      </nav>

      <div class="sidebar__footer">
        <div class="sidebar__user">
          <div class="avatar" id="sidebarAvatar">VD</div>
          <div class="sidebar__user-info">
            <div class="sidebar__user-name" id="sidebarUserName">Victor Diniz</div>
            <div class="sidebar__user-email" id="sidebarUserEmail">victor.diniz@gmail.com</div>
          </div>
        </div>
        <button class="sidebar__logout" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Sair do Painel
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <button class="sidebar__toggle" id="sidebarToggleBtn" aria-label="Abrir menu lateral">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <!-- ==================== CONTENT ==================== -->
    <main class="dashboard__content">
      
      <!-- HEADER -->
      <header class="dash-header">
        <div class="dash-header__left">
          <div style="font-size: var(--font-size-xs); color: var(--color-text-muted);">Painel / Meus Pets</div>
          <h1 class="dash-header__title" style="font-size: 1.5rem; margin: 0;">Meus Pets</h1>
        </div>
        <div class="dash-header__right">
          <a href="cadastrar-pet.html" class="btn btn-primary btn-sm">Cadastrar Novo Pet</a>
        </div>
      </header>

      <!-- MAIN BODY -->
      <div class="dashboard__main">
        
        <!-- Filter Bar -->
        <div class="filter-bar card card--bordered" style="padding: var(--space-md) var(--space-lg); margin-bottom: var(--space-xl);">
          <div style="display:flex; gap: var(--space-md); flex-wrap: wrap; width: 100%; align-items:center;">
            <div class="form-input-wrapper" style="min-width: 260px;">
              <input type="text" id="petSearch" class="form-input" placeholder="Buscar pet por nome ou raça...">
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </div>
            </div>
            
            <select id="speciesFilter" class="form-select" style="min-width: 140px; margin: 0;">
              <option value="">Todas Espécies</option>
              <option value="Cão">Cães</option>
              <option value="Gato">Gatos</option>
            </select>
          </div>
        </div>

        <!-- Pets Grid -->
        <div class="pets-grid" id="petsGridContainer">
          <!-- Fallback when empty -->
          <div class="text-center card card--bordered" id="noPetsCard" style="grid-column: 1 / -1; padding: var(--space-3xl) 0; width: 100%; display: none;">
            <p style="color: var(--color-text-muted); font-size: var(--font-size-lg);">Nenhum pet cadastrado correspondente.</p>
            <a href="cadastrar-pet.html" class="btn btn-primary btn-sm" style="margin-top: var(--space-md);">Cadastrar Novo Pet</a>
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Force Login Auth check
      const loggedUser = Utils.Storage.get('arca_user');
      if (!loggedUser) {
        window.location.href = 'login.html';
        return;
      }

      // Update User details
      const initials = loggedUser.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('sidebarAvatar').textContent = initials;
      document.getElementById('headerAvatar').textContent = initials;
      document.getElementById('sidebarUserName').textContent = loggedUser.name;
      document.getElementById('sidebarUserEmail').textContent = loggedUser.email;

      // Logout handler
      document.getElementById('logoutBtn').addEventListener('click', () => {
        Utils.Storage.remove('arca_user');
        window.location.href = 'index.html';
      });

      // Load Pets
      let myPets = Utils.Storage.get('arca_my_pets') || [];
      const gridContainer = document.getElementById('petsGridContainer');
      const noPetsCard = document.getElementById('noPetsCard');

      function renderPets(filteredPets) {
        // Clear all existing cards except fallback
        const cards = gridContainer.querySelectorAll('.pet-card');
        cards.forEach(c => c.remove());

        if (filteredPets.length === 0) {
          noPetsCard.style.display = 'block';
          return;
        }

        noPetsCard.style.display = 'none';

        filteredPets.forEach(pet => {
          const card = document.createElement('div');
          card.className = 'pet-card reveal revealed';
          card.setAttribute('data-id', pet.id);

          // Specie Colors & Avatars
          const bg = pet.species === 'Gato' ? '#FFF9C4' : '#E8F5E9';
          const avatarSvg = pet.species === 'Gato' 
            ? `<svg viewBox="0 0 200 150" style="background:${bg}; width:100%; height:160px;"><circle cx="100" cy="75" r="35" fill="#FBC02D"/><circle cx="90" cy="65" r="5" fill="#5F4B0B"/><circle cx="110" cy="65" r="5" fill="#5F4B0B"/><path d="M92 80 q8 5 16 0" stroke="#5F4B0B" stroke-width="3" fill="none"/></svg>`
            : `<svg viewBox="0 0 200 150" style="background:${bg}; width:100%; height:160px;"><circle cx="100" cy="75" r="35" fill="#81C784"/><circle cx="90" cy="65" r="5" fill="#1B5E20"/><circle cx="110" cy="65" r="5" fill="#1B5E20"/><path d="M92 80 q8 5 16 0" stroke="#1B5E20" stroke-width="3" fill="none"/></svg>`;

          card.innerHTML = `
            <div class="pet-card__image-wrapper">
              <span class="badge ${pet.neutered ? 'badge--success' : 'badge--warning'} pet-card__badge">
                ${pet.neutered ? 'Castrado' : 'Não Castrado'}
              </span>
              ${avatarSvg}
            </div>
            <div class="pet-card__body">
              <h3 class="pet-card__name">${pet.name}</h3>
              <div class="pet-card__info">
                <div class="pet-card__info-item"><span>${pet.gender}</span></div>
                <div class="pet-card__info-divider"></div>
                <div class="pet-card__info-item"><span>${pet.breed}</span></div>
                <div class="pet-card__info-divider"></div>
                <div class="pet-card__info-item"><span>${pet.weight}</span></div>
              </div>
              <p class="pet-card__desc">${pet.health || 'Pet muito saudável e dócil.'}</p>
              <div class="pet-card__footer">
                <a href="agendamento.html?petId=${pet.id}" class="btn btn-primary btn-sm btn-block">
                  Agendar Castração
                </a>
                <button class="btn btn-outline btn-sm btn-icon-only" onclick="deletePet(${pet.id})" aria-label="Remover Pet">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--color-danger);"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
              </div>
            </div>
          `;
          gridContainer.appendChild(card);
        });
      }

      // Initial Render
      renderPets(myPets);

      // Search & Filter binds
      const petSearch = document.getElementById('petSearch');
      const speciesFilter = document.getElementById('speciesFilter');

      function filterPets() {
        const query = petSearch.value.toLowerCase();
        const species = speciesFilter.value;

        const filtered = myPets.filter(pet => {
          const matchQuery = pet.name.toLowerCase().includes(query) || pet.breed.toLowerCase().includes(query);
          const matchSpecies = species ? pet.species === species : true;
          return matchQuery && matchSpecies;
        });

        renderPets(filtered);
      }

      petSearch.addEventListener('input', Utils.debounce(filterPets, 150));
      speciesFilter.addEventListener('change', filterPets);

      // Global delete function
      window.deletePet = function (id) {
        if (confirm('Tem certeza que deseja remover este pet? Todos os agendamentos vinculados serão mantidos.')) {
          myPets = myPets.filter(p => p.id !== id);
          Utils.Storage.set('arca_my_pets', myPets);
          
          if (window.showToast) window.showToast('Pet removido com sucesso!', 'success');
          filterPets();
        }
      };

    });
  </script>
</body>
</html>
